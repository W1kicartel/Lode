# Le prove di Lode sulle macchine di GitHub (gratis per i repository pubblici):
# - prove unitarie su Windows, Linux e macOS;
# - la voce Parakeet ONNX su Windows e Linux con il modello vero (a richiesta: «Run workflow» o «[voce]» nel messaggio);
# - la prova completa dell'app desktop su Windows (a richiesta: «Run workflow» o «[windows]» nel messaggio del commit):
#   installa davvero Obsidian, Ollama + il modello e la voce con gli installer di Lode, poi usa la barra come uno studente.
#   Risultati e foto della barra vanno nel ramo «risultati-windows».
# Il token di GitHub qui può solo leggere: questi job eseguono codice di altri (npm ci, gli installer di Ollama e Obsidian
# scaricati dalla prova) e con un token che scrive potrebbero cambiare main, i tag e le Release. Può scrivere solo
# «risultati-windows», che non esegue niente del progetto: prende i file della prova e li spinge nel suo ramo.
# Il checkout non lascia il token in .git/config (persist-credentials: false).
# Sulle pull request girano solo le prove unitarie (la prova completa e il ramo dei risultati restano fermi), con il token
# che legge e senza segreti. Sempre «pull_request», mai «pull_request_target»: quello darebbe al codice della PR i permessi
# e i segreti del repository.
name: Prove

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unita:
    name: Prove unitarie (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-vm-modules test/unita.mjs
      # il piano per chi lavora (js/ore.js): ore libere, turni, più esami a minuti, quello che non ci sta e le opzioni
      - name: Il piano per chi lavora
        run: node --experimental-vm-modules test/ore.mjs
      # informatica (docs/PROGETTO-INFORMATICA.md): «Cosa stampa?», «Segui il progetto», errori spiegati, registro nel vault
      - name: Cosa stampa? (albero del C, modelli, mutanti)
        run: node test/codice.mjs
      - name: Temi d'esame (compiti vecchi divisi in esercizi, uno al giorno nel piano)
        run: node --experimental-vm-modules test/temi.mjs
      - name: Cosa stampa? contro il compilatore vero
        # su Linux e macOS il compilatore c'è sempre: se manca è un errore. Su Windows, senza gcc, salta con un messaggio
        env:
          LODE_CC_OBBLIGATORIO: ${{ runner.os != 'Windows' && '1' || '0' }}
        run: node test/verifica-c.mjs
      - name: Cosa stampa? in Python e in Java, contro python3 e javac veri
        # python3 c'è su tutte e tre le macchine (su Windows si chiama python); Java (JDK) è già installato sulle macchine
        # di GitHub: obbligatorio su Linux, altrove se manca salta con un messaggio
        env:
          LODE_PYTHON_OBBLIGATORIO: '1'
          LODE_JAVA_OBBLIGATORIO: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: node test/stampa-vero.mjs
      - name: Segui il progetto
        run: node --experimental-vm-modules test/progetto.mjs
      - name: Errori spiegati in italiano
        run: node test/errori.mjs
      - name: Registro nel vault
        run: node --experimental-vm-modules test/diario.mjs
      - name: Ripasso in tasca
        run: node --experimental-vm-modules test/tasca.mjs
      # aggiornamenti (desktop/aggiorna.mjs): versioni, installer giusto, latest*.yml, Mac senza firma, finto electron-updater
      - name: Aggiornamenti
        run: node test/aggiorna.mjs
      # l'icona di Lode per chi la installa dal codice (desktop/collegamento.mjs): su Mac e Linux si crea in una cartella temporanea
      - name: Icona dal codice
        run: node test/collegamento.mjs
      # Moodle in sola lettura (desktop/moodle.mjs) contro un Moodle finto in locale: accesso, corsi, file, scadenze
      - name: Moodle
        run: node test/moodle.mjs
      # il ponte con gli agenti (desktop/agenti.mjs, agenti-collegamenti.mjs): eventi, avvisi, server, collegamenti a 10 agenti
      - name: Ponte con gli agenti
        run: node test/agenti.mjs
      # sincronizzazione v2 (docs/SINCRONIZZAZIONE.md): le parti pure del motore, il simulatore che prova se stesso, gli scenari
      # dei problemi noti e un giro di fuzz con semi fissi (riproducibile: un errore si rifà in locale con lo stesso seme)
      - name: Sincronizzazione (motore, simulatore, scenari, fuzz)
        run: |
          node test/sync-motore.mjs
          node test/sync-sim/autoprova.mjs
          node test/sync-sim/scenari.mjs --motore test/sync-sim/motore-v2.mjs
          node test/sync-sim/fuzz.mjs --motore test/sync-sim/motore-v2.mjs --giri 300 --seme 1
          node test/sync-sim/fuzz.mjs --motore test/sync-sim/motore-v2.mjs --giri 200 --seme 1 --cifratura
      # cosa finirebbe in pubblico (test/controlla-privacy.mjs): niente chiavi, percorsi con un nome vero, file privati,
      # codice da CDN senza versione esatta, pacchetti fuori dal registro npm. Gira anche quando una prova sopra è fallita
      - name: Privacy (chiavi, nomi, versioni esatte)
        if: ${{ !cancelled() }}
        run: node test/controlla-privacy.mjs

  voce-onnx:
    name: Voce Parakeet (ONNX) (${{ matrix.os }})
    # la voce Parakeet ONNX (desktop/voce-onnx.mjs) con il modello vero: trascrive le frasi di test/audio, misura un minuto
    # di audio, prova fila, riposo e ripieghi (test/voce-onnx.mjs). Solo a richiesta: «Run workflow» o «[voce]» nel
    # messaggio del commit. Il modello (~640 MB) si scarica con il codice dell'app (commit fisso, SHA256) la prima volta e
    # poi arriva dalla cache: la chiave contiene l'inizio delle 4 impronte di MODELLO, se cambiano si riscarica
    # (test/unita.mjs controlla che coincidano). Codice di altri (npm ci, l'addon, il modello): token che può solo leggere
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[voce]')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      # esattamente il lockfile, senza gli script dei pacchetti (Electron non serve: il motore gira in un Node figlio)
      - name: Dipendenze (sherpa-onnx con l'addon per il sistema)
        working-directory: desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Modello Parakeet dalla cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/modello-voce-onnx
          key: parakeet-tdt-0.6b-v3-int8-acfc2b445637-179e50c43d1a-3164c13fc282-d58544679ea4
      - name: Prova del motore
        env:
          LODE_MODELLO_ONNX: ${{ runner.temp }}/modello-voce-onnx
          LODE_VOCE_OBBLIGATORIA: '1'
        run: node test/voce-onnx.mjs --scarica

  app-windows:
    name: App completa su Windows
    # lunga (30-40 minuti): solo a richiesta, col pulsante «Run workflow» o con «[windows]» nel messaggio del commit
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[windows]')
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Dipendenze dell'app
        working-directory: desktop
        run: npm ci
      - name: Prova completa
        env:
          LODE_CI: '1'
          LODE_FOTO: ${{ runner.temp }}\out\foto
          LODE_RISULTATI: ${{ runner.temp }}\out\risultati.json
        run: node test/prova-app.mjs
      # la sincronizzazione nell'app vera: tre computer, uno alla volta, su una cartella «cloud» temporanea
      - name: Sincronizzazione nell'app
        run: node test/sincronizza-app.mjs
      # risultati e foto passano a «risultati-windows» (qui sotto) come artifact: questo job ha eseguito l'app, Ollama e gli
      # installer scaricati, che restano accesi fino alla fine e non devono vedere un token che scrive
      - name: Risultati per il ramo risultati-windows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risultati-windows
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore
          retention-days: 7
      - name: Riepilogo
        if: always()
        shell: pwsh
        run: |
          $f = Join-Path $env:RUNNER_TEMP 'out\risultati.json'
          if (Test-Path $f) {
            $r = Get-Content $f -Raw | ConvertFrom-Json
            "## Lode su Windows: $($r.ok) passate, $($r.ko) fallite" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            foreach ($p in $r.passi) { "- $(if ($p.passa) { '✓' } else { '✗' }) $($p.nome)" | Out-File -Append $env:GITHUB_STEP_SUMMARY }
            foreach ($p in $r.verifica) { "- $(if ($p.passa) { '✓' } else { '✗' }) $($p.nome)" | Out-File -Append $env:GITHUB_STEP_SUMMARY }
          }

  risultati-windows:
    name: Risultati nel ramo risultati-windows
    needs: app-windows
    # anche quando la prova fallisce; non quando app-windows è saltato (cioè a ogni push normale su main): sovrascriverebbe
    # il ramo con «nessun risultato»
    if: ${{ always() && needs.app-windows.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # l'unico job che scrive nel repository: niente checkout, niente npm, niente codice del progetto
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        # la prova può fermarsi prima di scrivere qualcosa: allora nel ramo va «nessun risultato»
        continue-on-error: true
        with:
          name: risultati-windows
          path: out
      - name: Push nel ramo risultati-windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p out && cd out
          [ -f risultati.json ] || echo '{"errore":"nessun risultato: la prova non è arrivata in fondo"}' > risultati.json
          printf 'commit: %s\nrun: %s\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > LEGGIMI.txt
          git init -q
          git checkout -q -b risultati-windows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Risultati della prova su Windows ($GITHUB_SHA)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" risultati-windows
